[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "green-absorptive-debt"
version = "0.1.0"
description = "Reproducible public-data pipeline for green absorptive-capacity debt research"
requires-python = ">=3.12,<3.13"
dependencies = [
  "duckdb==1.5.5",
  "httpx==0.28.1",
  "jsonschema>=4.25,<5",
  "lxml>=5,<7",
  "numpy==2.4.6",
  "openpyxl>=3.1,<4",
  "pandas==2.3.3",
  "polars==1.42.1",
  "pyarrow==25.0.0",
  "pycountry==26.2.16",
  "pypdf>=6,<7",
  "PyYAML==6.0.3",
  "scikit-learn==1.9.0",
  "scipy==1.18.0",
  "statsmodels==0.14.6",
  "xlrd>=2,<3",
]

[dependency-groups]
dev = [
  "pytest==8.4.2",
  "pytest-cov==7.0.0",
  "respx==0.22.0",
]

[tool.setuptools]
package-dir = {"" = "03_代码/src"}

[tool.setuptools.packages.find]
where = ["03_代码/src"]

[tool.pytest.ini_options]
pythonpath = ["03_代码/src"]
testpaths = ["03_代码/tests"]
addopts = "-ra"
